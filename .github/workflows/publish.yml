name: Publish build

on: push

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Bump version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Mod
        run: ./gradlew build

      - name: Parse Metadata
        id: meta
        run: |
          RAW_MSG="${{ github.event.head_commit.message }}"
          CHANGELOG=$(echo "$RAW_MSG" | sed '1d')
          
          # 定位编译生成的 jar 包
          JAR_PATH=$(ls build/libs/*.jar | grep -v "\-sources" | grep -v "\-dev" | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          
          # 从 neoforge.mods.toml 中提取版本号
          FULL_VER=$(unzip -p "$JAR_PATH" META-INF/neoforge.mods.toml | grep "^    version=" | cut -d'"' -f2)
          
          # 解析版本号 (例如 1.2.0-1.21.1)
          MOD_VER=$(echo "$FULL_VER" | cut -d'-' -f1)
          MC_VER=$(echo "$FULL_VER" | cut -d'-' -f2)
          
          # 如果解析失败，回退到文件名解析
          if [ -z "$MC_VER" ]; then
            MC_VER=$(echo "$JAR_PATH" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -n 1)
            MOD_VER=$(echo "$JAR_PATH" | sed "s/.*-\(.*\)-$MC_VER.jar/\1/")
          fi
          
          DISPLAY_NAME="${MC_VER} v${MOD_VER}"
          
          echo "mc_ver=$MC_VER" >> $GITHUB_OUTPUT
          echo "mod_ver=$MOD_VER" >> $GITHUB_OUTPUT
          echo "display_name=$DISPLAY_NAME" >> $GITHUB_OUTPUT
          
          echo "$CHANGELOG" > changelog.md

      - name: Upload to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT != '' }}
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: ${{ vars.CURSEFORGE_PROJECT }}
        run: |
          METADATA=$(jq -n --arg cl "$(cat changelog.md)" --arg dn "${{ steps.meta.outputs.display_name }}" \
            '{changelog: $cl, changelogType: "markdown", displayName: $dn, gameVersions: [10236], releaseType: "release"}')
          
          curl -X POST "https://minecraft.curseforge.com/api/projects/${CF_PROJECT}/upload-file" \
               -H "X-Api-Token: ${CF_TOKEN}" \
               -F "metadata=${METADATA}" \
               -F "file=@${{ steps.meta.outputs.jar_path }}"

      - name: Upload to Modrinth
        if: ${{ vars.MODRINTH_PROJECT != '' }}
        env:
          MR_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MR_PROJECT: ${{ vars.MODRINTH_PROJECT }}
        run: |
          METADATA=$(jq -n \
            --arg name "${{ steps.meta.outputs.display_name }}" \
            --arg ver "${{ steps.meta.outputs.mod_ver }}" \
            --arg cl "$(cat changelog.md)" \
            --arg pid "${MR_PROJECT}" \
            --arg mc "${{ steps.meta.outputs.mc_ver }}" \
            '{
              name: $name,
              version_number: $ver,
              changelog: $cl,
              dependencies: [],
              game_versions: [$mc],
              version_type: "release",
              loaders: ["neoforge"],
              project_id: $pid,
              file_parts: ["file"]
            }')

          curl -X POST "https://api.modrinth.com/v2/version" \
               -H "Authorization: ${MR_TOKEN}" \
               -F "data=${METADATA}" \
               -F "file=@${{ steps.meta.outputs.jar_path }}"
